name: Build and Test[node-ts-lambda]

on:
  push:
    branches:
      - node-ts-lambda
  pull_request:
    branches:
      - node-ts-lambda

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: TypeScript Build
        run: npm run build

      - name: Build and package
        run: |
          npm ci
          npm run build  # If you have a build step
          npm ci --production  # Install only production dependencies
          zip -r function.zip . -x '*.git*' '*.github*' '*.zip'
      - name: Deploy to AWS Lambda
        uses: appleboy/lambda-action@master
        with:
          aws_access_key_id: ${{ secrets.AWS_LAMBDA_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_LAMBDA_SECRET_ACCESS_KEY }}
          aws_region: ${{ secrets.AWS_REGION }}
          function_name: ${{ secrets.AWS_LAMBDA_FUNCTION_NAME }}
          zip_file: function.zip
        
