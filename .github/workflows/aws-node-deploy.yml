name: Deploy to EC2

on:
  push:
    branches:
      - node-express-js  # Deploy when pushing to the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up SSH key from PEM file
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_PEM_FILE" > ~/.ssh/id_rsa.pem
          chmod 600 ~/.ssh/id_rsa.pem
          ssh-add ~/.ssh/id_rsa.pem

      - name: Add EC2 host to known hosts
        run: |
          ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          ssh -i ~/.ssh/id_rsa.pem -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST << 'EOF'
            # Navigate to app directory
            cd /path/to/your/app
            git pull origin main
            npm install  # Install dependencies
            npm start  # Start the application
          EOF
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_PEM_FILE: ${{ secrets.EC2_PEM_FILE }}
