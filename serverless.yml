service: express-lambda-api

provider:
  name: aws
  runtime: nodejs18.x
  region: us-east-1
  memorySize: 128
  timeout: 10
  iamRoleStatements:
    - Effect: Allow
      Action:
        - dynamodb:*
        - s3:*
      Resource: "*"

functions:
  api:
    handler: handler.handler
    events:
      - http:
          path: /
          method: any
      - http:
          path: "{proxy+}"
          method: any

plugins:
  - serverless-offline

custom:
  serverless-offline:
    httpPort: 3000
